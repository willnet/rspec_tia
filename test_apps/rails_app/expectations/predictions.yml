cases:
  P6_new_template:
    description: A newly added, unrendered template still needs the static view rule.
    added_source: app/views/accounts/new.html.erb
    added_content: '<h1>New page</h1>'
    changed_files:
      - app/views/accounts/new.html.erb
    specs:
      - spec/requests/accounts_spec.rb
  P5_shared_partial:
    description: Runtime render edges select both consumers without a matching static rule.
    changed_files:
      - app/views/shared/_navigation.html.erb
    specs:
      - spec/requests/accounts_spec.rb
      - spec/requests/users_spec.rb
  P5_layout:
    description: Runtime layout edges survive fragment merge and select both requests.
    changed_files:
      - app/views/layouts/application.html.erb
    specs:
      - spec/requests/accounts_spec.rb
      - spec/requests/users_spec.rb
  P1_template:
    description: A static view rule selects the request spec independently of ERB coverage.
    changed_files:
      - app/views/accounts/index.html.erb
    static_only: true
    specs:
      - spec/requests/accounts_spec.rb
  P2_new_source:
    description: A newly added source absent from the baseline map matches an existing spec by name.
    added_source: app/services/future_value.rb
    added_content: "class FutureValue; end\n"
    changed_files:
      - app/services/future_value.rb
    specs:
      - spec/services/future_value_spec.rb
  P3_changed_spec:
    description: A spec change selects that spec itself.
    changed_files:
      - spec/services/unrelated_spec.rb
    specs:
      - spec/services/unrelated_spec.rb
  P4_configuration:
    description: Configuration changes match the explicitly configured full-run paths.
    changed_files:
      - config/routes.rb
    full_run: true
    reason: 'Full-run path changed: config/routes.rb'
    specs: all
